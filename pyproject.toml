[project]
name = "llm-data-pipeline"
version = "0.1.0"
description = "ETL Pipeline for LLM Data Preparation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "polars",
]

[project.scripts]
ingest = "src.ingest:main"
explore = "src.explore:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
...

    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "N"]
fix = true
